name: Sonda café

# Diagnóstico manual do robô do café: mostra o que as fontes de cotação
# devolvem para um servidor (texto, endpoints). Não altera nada.
on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sonda-cafe.mjs
