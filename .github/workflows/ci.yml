name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # O build só precisa da variável para o Prisma não reclamar; nenhum
      # banco é acessado durante a compilação.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
      APP_PASSWORD: ci
      AUTH_SECRET: ci-secret-nao-usado-em-producao
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npx vitest run
      - name: Build
        run: npx next build
